[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtsched"
version = "0.1.0"
description = "Real-time schedulability analysis and simulation for embedded task sets"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dušan Čorlija" }]
requires-python = ">=3.11"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Embedded Systems"]

[project.scripts]
rtsched = "rtsched.cli:main"

[tool.setuptools]
packages = ["rtsched"]
